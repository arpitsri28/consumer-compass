name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: consumer_compass_test
          POSTGRES_USER: compass_test
          POSTGRES_PASSWORD: ci-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U compass_test -d consumer_compass_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://compass_test:ci-test-only@127.0.0.1:5432/consumer_compass_test
      TEST_DATABASE_URL: postgresql://compass_test:ci-test-only@127.0.0.1:5432/consumer_compass_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Set nonsecret build placeholders
        run: cp .env.example .env.local
      - run: npm run lint
      - run: npm run db:migrate
      - run: npm run test:all
      - run: npm run build
      - name: Validate deployment shell syntax
        run: bash -n scripts/deploy-ec2.sh
